# Development release: local (tx), regional (CM) and global (R08, ComCat events deeper than 30 km)
# networks, and three edge cases.
release: dev
data_root: data
networks: [tx, CM, R08, R05, R06, TUN, R07]   # + edge cases: microseismic (R05), test-only (R06), few S picks (TUN), no magnitudes (R07)
gallery_networks: [tx, CM, R08]   # example networks drawn by `bepad figures`
workers: 16

# Windows per NETWORK, split AND scenario (38 scenarios)
windows_per_scenario: {train: 10, val: 3, test: 5}

# Defaults for every scenario (see bepad/build/config.py WINDOW_DEFAULTS)
window:
  length_s: auto
  length_factor: 2.0
  event_time_neighborhood_days: 365
  edge_event_prob: 0.3
  generated_ratio: [0.0, 0.2]      # generated picks / real picks, drawn per window
  noise_any_station_frac: 0.1      # rest of the noise: uniform in distance to the events
  # every event passes the pool rule inside the window (real picks)
  event_min_p: 4
  event_min_s: 0
  event_min_stations: 3

# Difficulty axes. `param` is the window parameter each level sets (`set`: more options of the axis).
axes:
  ev:
    param: n_events
    levels: {sparse: [1, 2], low: [3, 5], med: [6, 10], high: [11, 20]}
  seq:                               # sequences: aftershocks, foreshocks (bepad.build.windows)
    param: n_events
    levels: {low: [3, 5], med: [6, 10], high: [11, 20]}
    set: {sequence: true}
  noise:
    param: noise_ratio               # noise picks / true picks in the window
    levels: {none: 0.0, low: 0.1, med: 0.3, high: 1.0, extreme: 3.0}

grids: [[ev, noise], [seq, noise]]   # full cartesian products -> 20 + 15 scenarios

# One-dimensional sweep over azimuthal gap (how "out of network" events are)
extra_scenarios:
  gap-000-090: {n_events: [3, 5], noise_ratio: 0.3, gap_range: [0, 90]}
  gap-090-180: {n_events: [3, 5], noise_ratio: 0.3, gap_range: [90, 180]}
  gap-180-270: {n_events: [3, 5], noise_ratio: 0.3, gap_range: [180, 270]}
